<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liroc App</title>
    <!-- Официальный SDK Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 90vh;
        }

        .user-card {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            color: #000;
        }

        .user-info h3 { margin: 0 0 4px 0; font-size: 16px; }
        .user-info p { margin: 0; font-size: 13px; color: var(--text-secondary); }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 4px;
        }

        .navigation {
            margin-top: auto;
            display: flex;
            justify-content: space-around;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 16px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-btn.active { color: var(--accent-color); }
    </style>
</head>
<body>

    <!-- Шапка профиля -->
    <div class="user-card">
        <div class="user-avatar" id="avatar">L</div>
        <div class="user-info">
            <h3 id="user-name">Загрузка...</h3>
            <p id="user-id">ID: ---</p>
        </div>
    </div>

    <!-- Балансы Liroc -->
    <div class="stats-grid">
        <div class="stat-card">
            <div>Пыль (Liroc Dust)</div>
            <div class="value" id="dust-balance">0</div>
        </div>
        <div class="stat-card">
            <div>Предметы</div>
            <div class="value" id="items-count">0</div>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="navigation">
        <button class="nav-btn active">Forge</button>
        <button class="nav-btn">Predict</button>
        <button class="nav-btn">Market</button>
        <button class="nav-btn">Vault</button>
    </div>

    <script>
        // Инициализация Telegram Web App SDK
        const tg = window.Telegram.WebApp;
        
        // Расширяем окно на всю высоту
        tg.expand();

        // Получаем данные пользователя из Telegram
        const user = tg.initDataUnsafe?.user;

        if (user) {
            document.getElementById('user-name').innerText = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            document.getElementById('user-id').innerText = `ID: ${user.id}`;
            document.getElementById('avatar').innerText = user.first_name[0] || 'L';
        } else {
            document.getElementById('user-name').innerText = 'Тестовый Пользователь';
            document.getElementById('user-id').innerText = 'Запущено вне Telegram';
        }

        // Сообщаем Telegram, что приложение готово к отображению
        tg.ready();
    </script>
</body>
</html>
